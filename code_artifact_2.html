<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구룡리 변전소 3D 조망권 시뮬레이터 (물리 지형 버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden font-sans">

    <!-- 좌측 컨트롤 패널 -->
    <div class="w-96 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-2xl overflow-y-auto">
        <div class="p-5 border-b border-slate-800 bg-slate-950/50">
            <h1 class="text-lg font-extrabold tracking-tight text-amber-500">KEPCO 조망권 3D 엔진</h1>
            <p class="text-xs text-slate-400 mt-1">구룡리 변전소 부지 실사 모델링 반영 완료</p>
        </div>

        <div class="p-5 flex-1 space-y-6">
            <div class="space-y-3">
                <span class="text-xs font-bold text-slate-400 tracking-wider uppercase">1. 환경 설정</span>
                <div class="bg-slate-800/60 p-3 rounded-lg border border-slate-700/60 space-y-4">
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-300 font-semibold text-emerald-400">지형 굴곡 증폭</span>
                            <span id="maxElevVal" class="font-bold text-emerald-400">80 m</span>
                        </div>
                        <input type="range" id="maxElev" min="30" max="250" value="80" class="w-full accent-emerald-500">
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-300">부지 평탄화 표고</span>
                            <span id="siteElevVal" class="font-bold text-amber-400">65 m</span>
                        </div>
                        <input type="range" id="siteElev" min="30" max="100" value="65" class="w-full accent-amber-500">
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <span class="text-xs font-bold text-slate-400 tracking-wider uppercase">2. 주요 마을 조망권 분석</span>
                <div class="space-y-2" id="villageCards"></div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-800 bg-slate-950 text-center">
            <button id="resetCamBtn" class="text-xs text-slate-400 hover:text-white underline font-medium">전체 조감도 복귀</button>
        </div>
    </div>

    <!-- 우측 3D 뷰어 -->
    <div id="canvas-container" class="flex-1 relative bg-slate-950">
        <div id="loadingOverlay" class="absolute inset-0 bg-slate-950 z-20 flex flex-col items-center justify-center space-y-3">
            <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-bold text-slate-300">데이터(GLB, DEM) 로딩 중...</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 3000);
        camera.position.set(0, 150, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
        sun.position.set(100, 200, 100);
        sun.castShadow = true;
        scene.add(sun);

        const subGroup = new THREE.Group();
        scene.add(subGroup);

        // [중요] 변전소 모델 로딩 (물리적 안착)
        const loader = new GLTFLoader();
        loader.load('sim_test/sub_3d.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.15, 0.15, 0.15); // 크기 보정
            subGroup.add(model);
        });

        let terrainMesh = null, demCanvasData = null;

        // 물리적 지형 생성 함수 (CPU 버텍스 직접 깎기)
        function rebuildTerrain() {
            if(!demCanvasData) return;
            if(terrainMesh) scene.remove(terrainMesh);
            
            const planeGeo = new THREE.PlaneGeometry(240, 240, 128, 128);
            planeGeo.rotateX(-Math.PI / 2);
            
            const pos = planeGeo.attributes.position;
            const ctx = demCanvasData.getContext('2d');
            const data = ctx.getImageData(0,0,256,256).data;
            const maxElev = parseFloat(document.getElementById('maxElev').value) * 0.5;

            for(let i=0; i<pos.count; i++) {
                const u = (pos.getX(i) + 120) / 240;
                const v = 1 - (pos.getZ(i) + 120) / 240;
                const px = Math.floor(u * 255);
                const py = Math.floor(v * 255);
                const height = (data[(py * 256 + px) * 4] / 255) * maxElev;
                pos.setY(i, height);
            }
            planeGeo.computeVertexNormals();

            terrainMesh = new THREE.Mesh(planeGeo, new THREE.MeshStandardMaterial({color: 0xcccccc}));
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);

            // 지형 높이에 맞춰 변전소 지면 안착
            const siteY = parseFloat(document.getElementById('siteElev').value) * 0.5;
            subGroup.position.y = siteY;
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // 이미지 업로드 핸들러
        const img = new Image();
        img.onload = () => {
            const cvs = document.createElement('canvas');
            cvs.width = 256; cvs.height = 256;
            cvs.getContext('2d').drawImage(img, 0, 0, 256, 256);
            demCanvasData = cvs;
            rebuildTerrain();
        };
        img.src = 'sim_test/heightmap.png';

        // 마을 UI 카드 생성
        const villages = [
            { id: 'v1', name: '구룡1구마을회관', x: 45, z: -35 },
            { id: 'v2', name: '홍정2리마을회관', x: -70, z: -32 },
            { id: 'v3', name: '덕산마을회관', x: 10, z: 65 }
        ];

        villages.forEach(v => {
            const card = document.createElement('div');
            card.className = "p-3 bg-slate-800 rounded-lg cursor-pointer text-xs hover:bg-slate-700 transition";
            card.innerHTML = `${v.name} 시점 보기`;
            card.onclick = () => {
                camera.position.set(v.x, 20, v.z + 20);
                controls.target.set(0, 10, 0);
            };
            document.getElementById('villageCards').appendChild(card);
        });

        // 이벤트 연결
        document.getElementById('maxElev').addEventListener('input', (e) => {
            document.getElementById('maxElevVal').innerText = `${e.target.value} m`;
            rebuildTerrain();
        });
        document.getElementById('siteElev').addEventListener('input', (e) => {
            document.getElementById('siteElevVal').innerText = `${e.target.value} m`;
            rebuildTerrain();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
