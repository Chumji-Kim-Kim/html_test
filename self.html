<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 프레젠테이션 - 장예일</title>
    <style>
        /* Pretendard 폰트 불러오기 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            /* 옅은 체크무늬 배경 */
            background-image: radial-gradient(#e0e7ff 1px, transparent 1px);
            background-size: 20px 20px;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 900px;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 40px;
        }

        .box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.03);
        }

        /* Left Side */
        .left-section {
            flex: 1;
        }

        h1 { font-size: 24px; font-weight: 700; color: #1e40af; margin-bottom: 20px; }
        .info-item { margin-bottom: 15px; }
        .label { font-weight: 600; color: #64748b; font-size: 14px; }
        .value { font-weight: 500; color: #1e293b; font-size: 16px; margin-top: 4px; }

        /* Right Side */
        .right-section {
            flex: 0 0 300px;
            text-align: center;
        }

        h2 { font-size: 20px; color: #1e40af; margin-bottom: 5px; }
        
        .profile-img {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            object-fit: cover;
            margin: 20px 0;
            border: 4px solid #dbeafe;
        }

        .hobby-imgs {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .hobby-imgs img {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #e2e8f0;
        }

        svg { width: 24px; height: 24px; vertical-align: middle; margin-right: 8px; fill: #1e40af; }
    </style>
</head>
<body>

<div class="container">
    <!-- 좌측 설명란 -->
    <div class="left-section box">
        <h1>
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            자기소개
        </h1>
        <div class="info-item"><div class="label">이름</div><div class="value">장예일</div></div>
        <div class="info-item"><div class="label">생년월일</div><div class="value">98년 7월생</div></div>
        <div class="info-item"><div class="label">소속</div><div class="value">중부건설본부</div></div>
        <div class="info-item"><div class="label">담당 업무</div><div class="value">HVDC 500kV 서화성변환소 건설사업</div></div>
        <div class="info-item"><div class="label">MBTI</div><div class="value">ISFJ</div></div>
        <div class="info-item"><div class="label">남이 보는 나</div><div class="value">경상도 상테토남</div></div>
        <div class="info-item"><div class="label">실제의 나</div><div class="value">캐치캐치 안무고민중</div></div>
    </div>

    <!-- 우측 프로필란 -->
    <div class="right-section box">
        <h2>장예일</h2>
        <p style="color: #1e40af; font-weight: 500;">중부건설본부 서남해변환부</p>
        <img src="html_test/pics/IMG_3293.jpeg" class="profile-img" alt="프로필 사진">
        <div class="hobby-imgs">
            <img src="html_test/pics/IMG_0239.jpeg" alt="취미1">
            <img src="html_test/pics/IMG_4919.jpeg" alt="취미2">
        </div>
    </div>
</div>

</body>
</html>
